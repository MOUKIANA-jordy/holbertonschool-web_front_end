<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>Holberton - Web Stack - Bootstrap</title>
    <meta
      name="description"
      content="Bootstrap is a free and open-source CSS framework"
    >

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    >
  </head>

  <body>
    <!-- First line -->
    <div class="row">
      <div
        class="col-12 col-lg p-2 bg-primary text-center text-white"
      >
        Primary
      </div>

      <div
        class="col-12 col-lg p-2 bg-success text-center text-white"
      >
        Success
      </div>

      <div
        class="col-12 col-lg p-2 bg-danger text-center text-white"
      >
        Danger
      </div>

      <div
        class="col-12 col-lg p-2 bg-warning text-center text-white"
      >
        Warning
      </div>
    </div>

    <hr>

    <!-- Second line -->
    <div class="row">
      <div
        class="col-12 col-sm p-2 bg-primary text-center text-white"
      >
        Primary
      </div>

      <div
        class="col-12 col-sm p-2 bg-success text-center text-white"
      >
        Success
      </div>

      <div
        class="col-12 col-sm p-2 bg-danger text-center text-white"
      >
        Danger
      </div>

      <div
        class="col-12 col-sm p-2 bg-warning text-center text-white"
      >
        Warning
      </div>
    </div>

    <hr>

    <!-- Third line -->
    <div class="row">
      <div
        class="col-12 col-lg-2 p-2 bg-primary text-center text-white"
      >
        Primary
      </div>

      <div
        class="col-12 col-lg-4 p-2 bg-success text-center text-white"
      >
        Success
      </div>

      <div
        class="col-12 col-lg-6 p-2 bg-danger text-center text-white"
      >
        Danger
      </div>
    </div>

    <hr>

    <!-- Fourth line -->
    <div class="row">
      <div
        class="col p-2 bg-primary text-center text-white order-4 order-md-3 order-lg-2 order-xl-1"
      >
        Primary
      </div>

      <div
        class="col p-2 bg-success text-center text-white order-1 order-md-4 order-lg-3 order-xl-2"
      >
        Success
      </div>

      <div
        class="col p-2 bg-danger text-center text-white order-2 order-md-1 order-lg-4 order-xl-3"
      >
        Danger
      </div>

      <div
        class="col p-2 bg-warning text-center text-white order-3 order-md-2 order-lg-1 order-xl-4"
      >
        Warning
      </div>
    </div>

    <hr>

    <!-- Fifth line -->
    <div class="row d-flex justify-content-between">
      <div
        class="col-12 col-md-2 p-2 bg-primary text-center text-white"
      >
        Primary
      </div>

      <div
        class="col-12 col-md-2 p-2 bg-success text-center text-white"
      >
        Success
      </div>
    </div>

    <hr>

    <!-- Last line -->
    <div class="row">
      <div
        class="col-12 col-md-2 p-2 bg-primary text-center text-white"
      >
        Primary
      </div>

      <div
        class="col-12 col-md-2 offset-md-4 p-2 bg-success text-center text-white"
      >
        Success
      </div>

      <div
        class="col-12 col-md-2 offset-md-2 p-2 bg-danger text-center text-white"
      >
        Danger
      </div>
    </div>
  </body>
</html>
